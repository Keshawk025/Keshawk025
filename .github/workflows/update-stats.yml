name: Update GitHub Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Keshawk025
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import urllib.request
          from html import escape

          USER = os.environ["GITHUB_USERNAME"]
          TOKEN = os.environ.get("GITHUB_TOKEN", "")
          API = "https://api.github.com"
          OUT = "profile"
          os.makedirs(OUT, exist_ok=True)

          def get_json(url):
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "github-profile-cards",
                  "Authorization": f"Bearer {TOKEN}",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          def get_text(url):
              req = urllib.request.Request(url, headers={"User-Agent": "github-profile-cards"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", errors="replace")

          user = get_json(f"{API}/users/{USER}")

          repos = []
          page = 1
          while page <= 5:
              batch = get_json(f"{API}/users/{USER}/repos?per_page=100&page={page}&sort=updated")
              if not batch:
                  break
              repos.extend(r for r in batch if not r.get("fork"))
              if len(batch) < 100:
                  break
              page += 1

          language_bytes = {}
          total_stars = 0
          total_forks = 0
          for repo in repos:
              total_stars += repo.get("stargazers_count", 0) or 0
              total_forks += repo.get("forks_count", 0) or 0
              try:
                  langs = get_json(repo["languages_url"])
                  for lang, n in langs.items():
                      language_bytes[lang] = language_bytes.get(lang, 0) + n
              except Exception:
                  pass

          contrib_html = ""
          try:
              contrib_html = get_text(f"https://github.com/users/{USER}/contributions")
          except Exception:
              pass

          days = []
          pattern = re.compile(r'data-date="([0-9-]+)"[^>]*data-level="(\d+)"[^>]*')
          for m in pattern.finditer(contrib_html):
              d, level = m.groups()
              days.append((d, int(level)))
          days = sorted(days)

          count_pattern = re.compile(r'data-count="(\d+)"[^>]*data-date="([0-9-]+)"')
          counts = {d: int(c) for c, d in count_pattern.findall(contrib_html)}
          total_contributions = sum(counts.values()) if counts else sum(1 for _, level in days if level > 0)

          def longest_streak(values):
              best = cur = 0
              for value in values:
                  if value > 0:
                      cur += 1
                      best = max(best, cur)
                  else:
                      cur = 0
              return best

          levels = [level for _, level in days]
          current_streak = 0
          for _, level in reversed(days):
              if level > 0:
                  current_streak += 1
              elif current_streak:
                  break
          longest = longest_streak(levels)
          recent = days[-365:] if days else []
          nonzero = sum(1 for _, level in recent if level > 0)

          bg = "#0d1117"
          panel = "#161b22"
          border = "#30363d"
          text = "#f0f6fc"
          muted = "#8b949e"
          blue = "#58a6ff"
          green0 = "#161b22"
          green1 = "#0e4429"
          green2 = "#006d32"
          green3 = "#26a641"
          green4 = "#39d353"
          FONT = "'JetBrains Mono','Courier New',monospace"

          def svg_wrap(width, height, body):
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}">
          <rect width="100%" height="100%" rx="12" fill="{bg}"/>
          {body}
          </svg>'''

          stats_body = f'''
          <rect x="1" y="1" width="494" height="188" rx="12" fill="{panel}" stroke="{border}"/>
          <text x="24" y="38" fill="{blue}" font-family="{FONT}" font-size="18" font-weight="700">GitHub Stats</text>
          <text x="24" y="72" fill="{text}" font-family="{FONT}" font-size="28" font-weight="700">{total_contributions}</text>
          <text x="24" y="94" fill="{muted}" font-family="{FONT}" font-size="11">Contributions</text>
          <text x="190" y="72" fill="{text}" font-family="{FONT}" font-size="28" font-weight="700">{len(repos)}</text>
          <text x="190" y="94" fill="{muted}" font-family="{FONT}" font-size="11">Repositories</text>
          <text x="350" y="72" fill="{text}" font-family="{FONT}" font-size="28" font-weight="700">{user.get('followers',0)}</text>
          <text x="350" y="94" fill="{muted}" font-family="{FONT}" font-size="11">Followers</text>
          <line x1="24" y1="115" x2="470" y2="115" stroke="{border}"/>
          <text x="24" y="145" fill="{muted}" font-family="{FONT}" font-size="11">Stars received</text>
          <text x="130" y="145" fill="{text}" font-family="{FONT}" font-size="13" font-weight="600">{total_stars}</text>
          <text x="210" y="145" fill="{muted}" font-family="{FONT}" font-size="11">Forks</text>
          <text x="258" y="145" fill="{text}" font-family="{FONT}" font-size="13" font-weight="600">{total_forks}</text>
          <text x="24" y="170" fill="{muted}" font-family="{FONT}" font-size="11">Public repositories · {escape(user.get('name') or USER)}</text>
          '''
          open(f"{OUT}/stats.svg", "w", encoding="utf-8").write(svg_wrap(496, 190, stats_body))

          total_lang = sum(language_bytes.values()) or 1
          top_langs = sorted(language_bytes.items(), key=lambda x: x[1], reverse=True)[:6]
          lang_colors = ["#3572A5", "#F1E05A", "#3178C6", "#DA5B0B", "#563D7C", "#178600"]
          bar_x, bar_y, bar_w, bar_h = 24, 65, 448, 12
          segments = []
          x = bar_x
          for i, (lang, n) in enumerate(top_langs):
              w = bar_w * n / total_lang
              segments.append(f'<rect x="{x:.1f}" y="{bar_y}" width="{max(w,1):.1f}" height="{bar_h}" fill="{lang_colors[i % len(lang_colors)]}"/>')
              x += w
          legend = []
          for i, (lang, n) in enumerate(top_langs):
              col = i % 2
              row = i // 2
              lx = 24 + col * 225
              ly = 105 + row * 25
              pct = n / total_lang * 100
              legend.append(f'<circle cx="{lx}" cy="{ly-4}" r="5" fill="{lang_colors[i % len(lang_colors)]}"/><text x="{lx+12}" y="{ly}" fill="{text}" font-family="{FONT}" font-size="11">{escape(lang)} {pct:.1f}%</text>')
          langs_body = f'''
          <rect x="1" y="1" width="494" height="188" rx="12" fill="{panel}" stroke="{border}"/>
          <text x="24" y="38" fill="{blue}" font-family="{FONT}" font-size="18" font-weight="700">Top Languages</text>
          {''.join(segments)}
          {''.join(legend)}
          '''
          open(f"{OUT}/top-langs.svg", "w", encoding="utf-8").write(svg_wrap(496, 190, langs_body))

          streak_body = f'''
          <rect x="1" y="1" width="494" height="188" rx="12" fill="{panel}" stroke="{border}"/>
          <text x="24" y="38" fill="{blue}" font-family="{FONT}" font-size="18" font-weight="700">Contribution Streak</text>
          <text x="34" y="98" fill="{text}" font-family="{FONT}" font-size="40" font-weight="700">{current_streak}</text>
          <text x="34" y="121" fill="{muted}" font-family="{FONT}" font-size="11">Current streak</text>
          <text x="194" y="98" fill="{text}" font-family="{FONT}" font-size="40" font-weight="700">{longest}</text>
          <text x="194" y="121" fill="{muted}" font-family="{FONT}" font-size="11">Longest streak</text>
          <text x="356" y="98" fill="{text}" font-family="{FONT}" font-size="40" font-weight="700">{nonzero}</text>
          <text x="356" y="121" fill="{muted}" font-family="{FONT}" font-size="11">Active days / year</text>
          <text x="24" y="160" fill="{muted}" font-family="{FONT}" font-size="11">Based on GitHub's public contribution calendar</text>
          '''
          open(f"{OUT}/streak.svg", "w", encoding="utf-8").write(svg_wrap(496, 190, streak_body))

          # Larger, easier-to-read contribution heatmap.
          heat_body = f'''
          <rect x="1" y="1" width="988" height="250" rx="12" fill="{panel}" stroke="{border}"/>
          <text x="24" y="36" fill="{blue}" font-family="{FONT}" font-size="18" font-weight="700">Contribution Activity</text>
          <text x="24" y="56" fill="{muted}" font-family="{FONT}" font-size="11">Last 365 days</text>
          '''
          grid = recent[-364:]
          start_x, start_y = 28, 78
          cell, gap = 15, 3
          for i, (d, level) in enumerate(grid):
              col = i // 7
              row = i % 7
              color = [green0, green1, green2, green3, green4][min(level, 4)]
              heat_body += f'<rect x="{start_x + col*(cell+gap)}" y="{start_y + row*(cell+gap)}" width="{cell}" height="{cell}" rx="3" fill="{color}"/>'
          heat_body += f'<text x="28" y="215" fill="{muted}" font-family="{FONT}" font-size="10">Less</text>'
          for j, c in enumerate([green0, green1, green2, green3, green4]):
              heat_body += f'<rect x="64" y="207" width="15" height="15" rx="3" fill="{c}"/><text x="{84}" y="219" fill="{muted}" font-family="{FONT}" font-size="9">More</text>' if j == 4 else f'<rect x="{64+j*20}" y="207" width="15" height="15" rx="3" fill="{c}"/>'
          open(f"{OUT}/activity.svg", "w", encoding="utf-8").write(svg_wrap(990, 250, heat_body))
          PY

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub profile cards" || exit 0
          git push
