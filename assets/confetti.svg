<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="title desc">
  <title id="title">Animated confetti</title>
  <desc id="desc">A subtle celebratory confetti animation for the profile header.</desc>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="120" rx="16" fill="#0d1117"/>
  <g opacity="0.95" filter="url(#glow)">
    <g fill="#58a6ff">
      <rect x="55" y="-12" width="8" height="16" rx="2"><animateTransform attributeName="transform" type="translate" values="0 0; 35 132; 70 0" dur="2.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" additive="sum" type="rotate" values="0;180;360" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="360" y="-18" width="7" height="15" rx="2"><animateTransform attributeName="transform" type="translate" values="0 0;-25 138;-55 0" dur="3.2s" begin=".4s" repeatCount="indefinite"/><animateTransform attributeName="transform" additive="sum" type="rotate" values="0;220;440" dur="1.9s" repeatCount="indefinite"/></rect>
      <rect x="760" y="-14" width="8" height="14" rx="2"><animateTransform attributeName="transform" type="translate" values="0 0;40 136;80 0" dur="3s" begin=".2s" repeatCount="indefinite"/><animateTransform attributeName="transform" additive="sum" type="rotate" values="0;200;400" dur="1.8s" repeatCount="indefinite"/></rect>
      <rect x="1040" y="-10" width="7" height="15" rx="2"><animateTransform attributeName="transform" type="translate" values="0 0;-32 130;-64 0" dur="2.7s" begin=".7s" repeatCount="indefinite"/><animateTransform attributeName="transform" additive="sum" type="rotate" values="0;160;320" dur="1.6s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#a371f7">
      <rect x="165" y="-10" width="6" height="13" rx="2"><animateTransform attributeName="transform" type="translate" values="0 0;28 130;56 0" dur="3.1s" begin=".1s" repeatCount="indefinite"/><animateTransform attributeName="transform" additive="sum" type="rotate" values="0;270;540" dur="2s" repeatCount="indefinite"/></rect>
      <rect x="575" y="-15" width="7" height="14" rx="2"><animateTransform attributeName="transform" type="translate" values="0 0;-38 134;-76 0" dur="2.9s" begin=".5s" repeatCount="indefinite"/><animateTransform attributeName="transform" additive="sum" type="rotate" values="0;180;360" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="890" y="-8" width="6" height="14" rx="2"><animateTransform attributeName="transform" type="translate" values="0 0;26 128;52 0" dur="3.3s" begin=".8s" repeatCount="indefinite"/><animateTransform attributeName="transform" additive="sum" type="rotate" values="0;240;480" dur="1.9s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#39d353">
      <circle cx="250" cy="2" r="4"><animateTransform attributeName="transform" type="translate" values="0 0;-30 124;-60 0" dur="2.6s" begin=".3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.95;.95;0" dur="2.6s" begin=".3s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="1" r="4"><animateTransform attributeName="transform" type="translate" values="0 0;34 126;68 0" dur="3.4s" begin=".1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.95;.95;0" dur="3.4s" begin=".1s" repeatCount="indefinite"/></circle>
      <circle cx="1130" cy="4" r="4"><animateTransform attributeName="transform" type="translate" values="0 0;-24 122;-48 0" dur="2.8s" begin=".6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.95;.95;0" dur="2.8s" begin=".6s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#f2cc60">
      <rect x="470" y="-8" width="6" height="12" rx="2"><animateTransform attributeName="transform" type="translate" values="0 0;20 130;40 0" dur="2.8s" begin=".6s" repeatCount="indefinite"/><animateTransform attributeName="transform" additive="sum" type="rotate" values="0;200;400" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="970" y="-12" width="7" height="13" rx="2"><animateTransform attributeName="transform" type="translate" values="0 0;30 128;60 0" dur="3s" begin=".2s" repeatCount="indefinite"/><animateTransform attributeName="transform" additive="sum" type="rotate" values="0;210;420" dur="1.8s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#ff7b72">
      <circle cx="120" cy="2" r="3"><animateTransform attributeName="transform" type="translate" values="0 0;22 122;44 0" dur="3.1s" begin=".5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="3.1s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="-1" r="3"><animateTransform attributeName="transform" type="translate" values="0 0;-28 124;-56 0" dur="2.7s" begin=".9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.7s" begin=".9s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
